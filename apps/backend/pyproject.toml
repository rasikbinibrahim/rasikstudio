[project]
name = "rasik-studio-backend"
version = "0.1.0"
description = "Rasik Studio backend service (FastAPI)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "pgvector>=0.3.6",
    "redis>=5.1.1",
    "pyjwt[crypto]>=2.9.0",
    "bcrypt>=4.2.0",
    "cryptography>=43.0.3",
    "httpx>=0.27.2",
    "email-validator>=2.2.0",
    "anthropic>=0.40.0",
    "openai>=1.55.0",
    # `google-generativeai` (named in phase-09-model-router.md) reached end-of-support upstream —
    # its own import now raises a `FutureWarning` telling integrators to move to `google-genai`.
    # Using the actively maintained SDK instead; see GeminiProvider's docstring.
    "google-genai>=2.16.0",
    "tokenizers>=0.20.3",
    "tiktoken>=0.8.0",
    "pyyaml>=6.0.2",
    "aiofiles>=24.1.0",
    "playwright>=1.62.0",
    "celery[redis]>=5.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres]>=4.8.2",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "freezegun>=1.5.1",
    "websockets>=13.1",
    "types-pyyaml>=6.0.12",
    "types-aiofiles>=24.1.0",
    "httpx2>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 85% matches TESTING_STRATEGY.md's own backend target (phase-16-testing.md's acceptance
# criterion is literally `pytest --cov=app --cov-fail-under=85`) — real measured coverage is
# ~91% as of Phase 16, so this has real margin, not a number picked to just barely pass today.
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["app"]
# Pure-interface Protocol ports have no executable statements to cover — same reasoning as the
# desktop coverage config's `src/types/**` exclusion.
omit = ["app/domain/ports/*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# `celery` ships no py.typed marker / stubs as of the version pinned here — same category as any
# other untyped third-party dependency would be, not specific to this integration.
[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true
